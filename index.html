<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141A" media="(prefers-color-scheme: dark)">
<title>오늘의 지식</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#EEF2F6;--card:#FFFFFF;--ink:#14202B;--ink2:#5B6978;--line:#D8DFE7;--tint:rgba(20,32,43,.05);--ok:#0E8A5F;--bad:#C8322B;--c:#1F4FD8}
@media(prefers-color-scheme:dark){:root{--bg:#0F141A;--card:#171E26;--ink:#ECF1F6;--ink2:#9AA8B6;--line:#2A3440;--tint:rgba(236,241,246,.06);--ok:#3FBF8A;--bad:#F06A60}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--c);text-decoration:none;font-weight:600}
a:hover,a:focus-visible{text-decoration:underline}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
main{max-width:520px;margin:0 auto;padding:12px 16px 110px}

/* 상단 바 */
.top{display:flex;justify-content:space-between;align-items:center;height:48px}
.top .brand{font-weight:800;font-size:17px;letter-spacing:-.01em}
.top button{background:none;border:0;padding:8px 10px;border-radius:8px;font-weight:600;color:var(--ink2)}
.top button:hover{background:var(--tint)}

/* 일력 */
.hero{padding:28px 0 20px;border-bottom:2px solid var(--ink)}
.hero .day{font-size:96px;font-weight:800;line-height:.9;letter-spacing:-.05em;margin:0}
.hero .meta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px}
.hero .meta b{font-size:22px;font-weight:700}
.hero .meta span{color:var(--ink2);font-size:15px}
.hero .progress{margin-top:16px;height:6px;display:flex;gap:4px}
.hero .progress i{flex:1;position:relative;background:var(--line);border-radius:3px;overflow:hidden}
.hero .progress i b{position:absolute;inset:0;width:0;background:var(--c)}
.hero .note{margin:8px 0 0;font-size:14px;color:var(--ink2)}

/* 카테고리 목록 */
.cats{margin-top:18px;display:grid;gap:12px}
.cat{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 18px 18px 0;overflow:hidden}
.cat i{display:block;height:100%;background:var(--c)}
.cat>div{min-width:0}
.cat h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--c)}
.cat p{margin:4px 0 0;font-size:14px;color:var(--ink2)}
.cat .tz{margin-top:8px;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .st{font-weight:700;font-size:15px;white-space:nowrap;color:var(--ink2)}
.cat .st.done{color:var(--c)}

/* 카테고리 페이지 */
.head{color:#fff;background:var(--c);border-radius:14px;padding:22px 20px;margin-top:6px}
.head h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.03em}
.head p{margin:6px 0 0;opacity:.85;font-size:15px}
.read{margin-top:14px;display:grid;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--tint)}
.item .body{padding:16px 18px 18px}
.item h3{margin:0 0 8px;font-size:19px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.item p{margin:0;color:var(--ink);font-size:15.5px}
.item a{display:inline-block;margin-top:10px;font-size:14px}
.term .body{border-left:6px solid var(--c)}

/* 하단 고정 버튼 */
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock .in{max-width:520px;margin:0 auto}
.primary{width:100%;padding:16px;border:0;border-radius:12px;background:var(--c);color:#fff;font-size:17px;font-weight:700}
.ghost{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:600;margin-top:10px}

/* 퀴즈 */
.dots{display:flex;gap:6px;margin:14px 0 18px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--c)}
.dots i.ok{background:var(--ok)}
.dots i.bad{background:var(--bad)}
.qlab{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--c)}
.q{font-size:21px;font-weight:700;line-height:1.4;letter-spacing:-.01em;margin:0 0 18px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;margin:0 0 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:16.5px;line-height:1.4}
.choice b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink2)}
.choice:not(:disabled):hover{border-color:var(--c)}
.choice.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.choice.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.choice.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.choice.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
.choice:disabled{cursor:default}
.exp{margin-top:6px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--c) 10%,var(--card));font-size:15.5px}
.exp strong{display:block;margin-bottom:4px}

/* 결과 */
.score{text-align:center;padding:28px 0 8px}
.score .n{font-size:72px;font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--c)}
.score p{margin:6px 0 0;color:var(--ink2)}
.rev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:12px}
.rev h4{margin:0 0 8px;font-size:16px;font-weight:700}
.rev p{margin:0 0 6px;font-size:15px}
.rev .ans{font-weight:700}
.rev .ans.bad{color:var(--bad)}
.rev .ans.ok{color:var(--ok)}

/* 기록 */
.hist{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 18px;border:0;border-bottom:1px solid var(--line);background:none}
.hrow:last-child{border-bottom:0}
.hrow .d{font-weight:700;flex:1}
.hrow .chip{font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;background:var(--c)}
.hrow .tot{font-weight:800;min-width:48px;text-align:right}
.empty{padding:36px 18px;text-align:center;color:var(--ink2)}
@media(prefers-reduced-motion:no-preference){.hero .progress i{transition:width .5s ease}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY='quiz-results';
const CATS={'시사':{c:'#1F4FD8',read:'뉴스'},'경제':{c:'#0E8A5F',read:'용어'},'상식':{c:'#D9860B',read:'상식'}};
const app=document.getElementById('app');
const results=JSON.parse(localStorage.getItem(KEY)||'{}');
const save=()=>localStorage.setItem(KEY,JSON.stringify(results));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kstToday=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const get=u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json()});
const WD=['일','월','화','수','목','금','토'];
let dates=[],quiz=null;

const ans=()=>(results[quiz.date]??={answers:Array(quiz.questions.length).fill(null)}).answers;
const qIdx=k=>quiz.questions.map((q,i)=>q.category===k?i:-1).filter(i=>i>=0);
const scoreOf=(d,is)=>is.filter(i=>results[d]?.answers?.[i]===quiz.questions[i].answer).length;
const doneOf=(d,is)=>is.every(i=>results[d]?.answers?.[i]!=null);
const bar=(right='')=>`<div class="top"><span class="brand">오늘의 지식</span>${right}</div>`;
const backBtn=(label,fn)=>{const b=document.getElementById('back');if(b)b.onclick=fn};
const dock=html=>`<div class="dock"><div class="in">${html}</div></div>`;
const setColor=k=>document.body.style.setProperty('--c',k?CATS[k].c:'#1F4FD8');

async function init(){
  try{dates=await get('data/index.json')}catch(e){app.innerHTML=bar()+`<div class="empty">문제 목록을 불러올 수 없어요.<br>${esc(e.message)}</div>`;return}
  const t=kstToday();await load(dates.includes(t)?t:dates[0]);
}
async function load(d){
  if(!d){app.innerHTML=bar()+'<div class="empty">아직 올라온 문제가 없어요.<br>내일 아침에 다시 열어 보세요.</div>';return}
  quiz=await get(`data/${d}.json`);home();
}

function home(){
  setColor(null);window.scrollTo(0,0);
  const [y,m,dd]=quiz.date.split('-').map(Number);
  const wd=WD[new Date(y,m-1,dd).getDay()];
  const all=quiz.questions.map((_,i)=>i),n=all.filter(i=>results[quiz.date]?.answers?.[i]!=null).length;
  const t=kstToday();
  app.innerHTML=bar(`<button id="hist">기록</button>`)+`
  <section class="hero">
    <p class="day">${dd}</p>
    <div class="meta"><b>${m}월 ${wd}요일</b><span>${n===all.length?`오늘 ${scoreOf(quiz.date,all)} / ${all.length} 정답`:`${n} / ${all.length} 풀었어요`}</span></div>
    <div class="progress">${Object.keys(CATS).map(k=>{const is=qIdx(k),a=is.filter(i=>results[quiz.date]?.answers?.[i]!=null).length;return `<i style="--c:${CATS[k].c}"><b style="width:${a/is.length*100}%"></b></i>`}).join('')}</div>
    ${quiz.date===t?'':`<p class="note">${t} 문제는 아직 안 올라와서 ${quiz.date} 것을 보여줘요.</p>`}
  </section>
  <div class="cats">${Object.keys(CATS).map(k=>{
    const is=qIdx(k),items=quiz.briefing.filter(b=>b.category===k),d=doneOf(quiz.date,is),a=is.filter(i=>results[quiz.date]?.answers?.[i]!=null).length;
    return `<button class="cat" data-k="${k}" style="--c:${CATS[k].c}"><i></i><div><h2>${k}</h2><p>${CATS[k].read} ${items.length}개 읽고 문제 ${is.length}개</p>${items[0]?`<p class="tz">${esc(items[0].title)}</p>`:''}</div><span class="st ${d?'done':''}">${d?`${scoreOf(quiz.date,is)} / ${is.length} 정답`:a?`${a} / ${is.length} 푸는 중`:'시작하기'}</span></button>`}).join('')}
  </div>`;
  for(const b of app.querySelectorAll('.cat'))b.onclick=()=>catPage(b.dataset.k);
  document.getElementById('hist').onclick=history;
}

function catPage(k){
  setColor(k);window.scrollTo(0,0);
  const is=qIdx(k),items=quiz.briefing.filter(b=>b.category===k),d=doneOf(quiz.date,is);
  app.innerHTML=bar(`<button id="back">홈</button>`)+`
  <section class="head"><h1>${k}</h1><p>${quiz.date} · ${CATS[k].read} ${items.length}개를 읽고 문제 ${is.length}개를 풀어요</p></section>
  <div class="read">${items.map(b=>`<article class="item ${k==='시사'?'':'term'}">${b.image?`<img src="${esc(b.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<div class="body"><h3>${esc(b.title)}</h3><p>${esc(b.summary)}</p>${b.source?`<a href="${esc(b.source)}" target="_blank" rel="noopener">기사 원문 보기</a>`:''}</div></article>`).join('')}</div>
  ${dock(`<button class="primary" id="go">${d?'결과 다시 보기':'퀴즈 풀기'}</button>`)}`;
  backBtn('back',home);
  document.getElementById('go').onclick=()=>d?catResult(k):question(k);
}

function question(k){
  setColor(k);window.scrollTo(0,0);
  const is=qIdx(k),a=ans(),pos=is.findIndex(i=>a[i]==null),qi=is[pos],q=quiz.questions[qi];
  app.innerHTML=bar(`<button id="back">${k} 읽기</button>`)+`
  <div class="dots">${is.map(i=>`<i class="${a[i]==null?(i===qi?'on':''):a[i]===quiz.questions[i].answer?'ok':'bad'}"></i>`).join('')}</div>
  <p class="qlab">${k} ${pos+1} / ${is.length}</p>
  <p class="q">${esc(q.q)}</p>
  ${q.choices.map((c,i)=>`<button class="choice" data-i="${i}"><b>${i+1}</b><span>${esc(c)}</span></button>`).join('')}
  <div id="exp"></div>`;
  backBtn('back',()=>catPage(k));
  for(const b of app.querySelectorAll('.choice'))b.onclick=()=>{
    const i=+b.dataset.i;a[qi]=i;save();
    app.querySelectorAll('.choice').forEach((x,j)=>{x.disabled=true;if(j===q.answer)x.classList.add('ok');else if(j===i)x.classList.add('bad')});
    app.querySelectorAll('.dots i')[pos].className=i===q.answer?'ok':'bad';
    const last=pos===is.length-1;
    document.getElementById('exp').innerHTML=`<div class="exp"><strong>${i===q.answer?'맞았어요':'아쉬워요'}</strong>${esc(q.explanation)}${q.source?` <a href="${esc(q.source)}" target="_blank" rel="noopener">출처</a>`:''}</div>
    ${dock(`<button class="primary" id="next">${last?`${k} 결과 보기`:'다음 문제'}</button>`)}`;
    document.getElementById('next').onclick=()=>last?catResult(k):question(k);
  };
}

function catResult(k){
  setColor(k);window.scrollTo(0,0);
  const is=qIdx(k),a=ans(),s=scoreOf(quiz.date,is);
  app.innerHTML=bar(`<button id="back">홈</button>`)+`
  <div class="score"><div class="n">${s} / ${is.length}</div><p>${k} ${s===is.length?'전부 맞았어요':s===0?'내일 다시 읽어 봐요':'틀린 건 아래에서 다시 봐요'}</p></div>
  ${is.map(i=>{const q=quiz.questions[i],ok=a[i]===q.answer;return `<div class="rev"><h4>${esc(q.q)}</h4><p class="ans ${ok?'ok':'bad'}">${ok?'정답':'오답'} · ${esc(q.choices[q.answer])}</p>${ok?'':`<p>내가 고른 답: ${esc(q.choices[a[i]])}</p>`}<p>${esc(q.explanation)}</p></div>`}).join('')}
  ${dock(`<button class="primary" id="home">홈으로</button>`)}`;
  backBtn('back',home);document.getElementById('home').onclick=home;
}

async function history(){
  setColor(null);window.scrollTo(0,0);
  const cur=quiz;
  const rows=[];
  for(const d of dates){
    const r=results[d];
    if(!r){rows.push(`<button class="hrow" data-d="${d}"><span class="d">${d}</span><span class="tot" style="color:var(--ink2)">안 품</span></button>`);continue}
    const qz=d===cur.date?cur:await get(`data/${d}.json`);
    const per=Object.keys(CATS).map(k=>{const is=qz.questions.map((q,i)=>q.category===k?i:-1).filter(i=>i>=0);const s=is.filter(i=>r.answers[i]===qz.questions[i].answer).length;return `<span class="chip" style="--c:${CATS[k].c}">${k} ${s}/${is.length}</span>`}).join('');
    const tot=qz.questions.filter((q,i)=>r.answers[i]===q.answer).length;
    rows.push(`<button class="hrow" data-d="${d}"><span class="d">${d}</span>${per}<span class="tot">${tot}/${qz.questions.length}</span></button>`);
  }
  app.innerHTML=bar(`<button id="back">홈</button>`)+`<div class="hist">${rows.join('')||'<div class="empty">아직 기록이 없어요</div>'}</div>`;
  backBtn('back',()=>{quiz=cur;home()});
  for(const b of app.querySelectorAll('.hrow'))b.onclick=()=>load(b.dataset.d);
}
init();
</script>
</body>
</html>
